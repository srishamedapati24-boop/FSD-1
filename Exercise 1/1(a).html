<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>
<h2>Ordered List</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ol>
    <h2>Unordered List</h2>
    <ul>
        <li>Red</li>
        <li>Green</li>
        <li>Blue</li>
    </ul>
 
    <h2>Nested List</h2>
    <ul>
        <li>Fruits
            <ul>
                <li>Apple</li>
                <li>Mango</li>
            </ul>
        </li>
    </ul>
    <h2>Ordered List in Unordered List</h2>
    <ul>
        <li>Subjects
            <ol>
                <li>Math</li>
                <li>Science</li>
            </ol>
        </li>
    </ul>
    <h2>Definition List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Used to create web pages.</dd>
        <dt>CSS</dt>
        <dd>Used to style web pages.</dd>
    </dl>
</body>
</html>
