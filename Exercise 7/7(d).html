<!DOCTYPE html>
<html>
<head>
    <title>Math Object</title>
</head>
<body>
<h2>Math Object</h2>
<script>
    document.write("Value of PI: " + Math.PI + "<br>");
    document.write("Value of E: " + Math.E + "<br><br>");
    document.write("Square Root of 25: " +
                   Math.sqrt(25) + "<br>");
    document.write("2 Power 3: " +
                   Math.pow(2, 3) + "<br>");
    document.write("Round of 4.6: " +
                   Math.round(4.6) + "<br>");
    document.write("Floor of 4.9: " +
                   Math.floor(4.9) + "<br>");
    document.write("Ceil of 4.1: " +
                   Math.ceil(4.1) + "<br>");
    document.write("Maximum: " +
                   Math.max(10, 20, 30) + "<br>");
    document.write("Minimum: " +
                   Math.min(10, 20, 30) + "<br>");
    document.write("Random Number: " +
                   Math.random());
</script>
</body>
</html>
